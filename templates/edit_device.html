<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit {{ device.name }} - Device Register</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <h1>Device Register</h1>
    <h2>Edit Device</h2>

    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}

    <form action="/devices/{{ device.id }}/edit" method="post">
        <div>
            <label for="name">Device Name</label><br>
            <input type="text" id="name" name="name" value="{{ device.name }}" required>
        </div>
        <br>
        <div>
            <label for="model">Model</label><br>
            <input type="text" id="model" name="model" value="{{ device.model or '' }}">
        </div>
        <br>
        <div>
            <label for="serial_number">Serial Number</label><br>
            <input type="text" id="serial_number" name="serial_number" value="{{ device.serial_number or '' }}">
        </div>
        <br>
        <div>
            <label for="description">Description</label><br>
            <textarea id="description" name="description" rows="4" cols="40">{{ device.description or '' }}</textarea>
        </div>
        <br>
        <div>
            <label for="type_id">Type</label><br>
            <select id="type_id" name="type_id">
                <option value="">-- Unspecified --</option>
                {% for item in classifications.types %}
                    <option value="{{ item.id }}" {% if item.id == device.type_id %}selected{% endif %}>{{ item.name }}</option>
                {% endfor %}
            </select>
        </div>
        <br>
        <div>
            <label for="category_id">Category</label><br>
            <select id="category_id" name="category_id">
                <option value="">-- Unspecified --</option>
                {% for item in classifications.categories %}
                    <option value="{{ item.id }}" {% if item.id == device.category_id %}selected{% endif %}>{{ item.name }}</option>
                {% endfor %}
            </select>
        </div>
        <br>
        <div>
            <label for="location_id">Location</label><br>
            <select id="location_id" name="location_id">
                <option value="">-- Unspecified --</option>
                {% for item in classifications.locations %}
                    <option value="{{ item.id }}" {% if item.id == device.location_id %}selected{% endif %}>{{ item.name }}</option>
                {% endfor %}
            </select>
        </div>
        <br>
        <div>
            <label for="os_id">Operating System</label><br>
            <select id="os_id" name="os_id">
                <option value="">-- Unspecified --</option>
                {% for item in classifications.operating_systems %}
                    <option value="{{ item.id }}" {% if item.id == device.os_id %}selected{% endif %}>{{ item.name }}</option>
                {% endfor %}
            </select>
        </div>
        <br>
        <div>
            <label for="owner_id">Owner</label><br>
            <select id="owner_id" name="owner_id">
                <option value="">-- Unassigned --</option>
                {% for user in users %}
                    <option value="{{ user.id }}" {% if user.id == device.owner_id %}selected{% endif %}>
                        {{ user.username }}
                    </option>
                {% endfor %}
            </select>
        </div>
        <br>
        <button type="submit">Save Changes</button>
    </form>

    <p><a href="/devices/{{ device.id }}">Back to device details</a></p>
</body>
</html>
